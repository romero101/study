<p class="fig-title">Как работает «фасад» на примере видео</p>
<ol class="flow">
  <li class="win"><b>Страница открылась</b><span>на месте плеера — превью-картинка с кнопкой запуска, она почти ничего не весит</span></li>
  <li><b>Человек нажал на превью</b><span>так делает тот, кому видео действительно нужно</span></li>
  <li><b>Плеер загрузился</b><span>только сейчас и только у этого посетителя</span></li>
</ol>
