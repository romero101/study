<p class="fig-title">Как растягивается переписка</p>
<ol class="tl">
  <li><b>Днём</b>клиент пишет: «Сколько стоит забор?»</li>
  <li><b>Сразу</b>вы уточняете высоту</li>
  <li class="warn"><b>Через три часа</b>он отвечает</li>
  <li class="warn"><b>Вечером</b>отвечаете вы — а он уже созвонился с другими</li>
</ol>
