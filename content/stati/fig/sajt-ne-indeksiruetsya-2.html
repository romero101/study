<p class="fig-title">Что написано в robots.txt — и что это значит</p>
<table class="sheet">
  <thead><tr><th>Для кого</th><th>Строка</th><th>Что это значит</th></tr></thead>
  <tbody>
    <tr class="bad"><td>User-agent: *</td><td>Disallow: /</td><td>весь сайт закрыт от всех роботов</td></tr>
    <tr class="bad"><td>User-agent: Yandex</td><td>Disallow: /</td><td>весь сайт закрыт от Яндекса</td></tr>
    <tr class="good"><td>User-agent: *</td><td>Disallow: /admin/</td><td>закрыт только служебный раздел, сайт открыт</td></tr>
  </tbody>
</table>
