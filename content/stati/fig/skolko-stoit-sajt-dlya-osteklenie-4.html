<p class="fig-title">Когда заказывать, чтобы успеть к пику</p>
<ol class="tl">
  <li><b>Январь — февраль</b>демо, фото по сериям домов, прайс для квиза</li>
  <li class="warn"><b>Март</b>запуск страницы и рекламы до весеннего пика</li>
  <li><b>Лето</b>досъёмка объектов, отзывы, новые посадочные</li>
  <li class="warn"><b>Август</b>кампании на тёплое остекление к осеннему пику</li>
</ol>
