<p class="fig-title">Как цель учит стратегию не тому</p>
<ol class="flow">
  <li><b>Человек нажал «Отправить»</b><span>поле телефона заполнено с ошибкой</span></li>
  <li class="lost"><b>Цель сработала</b><span>она стоит на нажатии кнопки, а не на успешной отправке</span></li>
  <li class="lost"><b>Заявки нет</b><span>форма показала ошибку, человек ушёл</span></li>
  <li class="lost"><b>Стратегия «довольна»</b><span>и приводит ещё людей, которые жмут кнопку</span></li>
