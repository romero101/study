<p class="fig-title">Сколько ждать проверки карточки</p>
<ol class="tl">
  <li><b>До 2 дней</b>телефон карточки есть на вашем сайте или в соцсетях</li>
  <li class="warn"><b>До 6 дней</b>проверка нового номера через «Исправить неточность»</li>
  <li class="warn"><b>До 2 недель</b>телефон нигде больше не встречается</li>
  <li><b>2 недели — месяц</b>карточка начинает попадать в блок организаций в поиске</li>
</ol>
