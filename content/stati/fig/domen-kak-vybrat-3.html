<p class="fig-title">Что происходит с доменом, если его не продлить</p>
<ol class="tl">
  <li><b>За 50–60 дней</b>регистратор напоминает о продлении — на почту из вашего аккаунта</li>
  <li class="warn"><b>Конец срока</b>регистрация на год закончилась</li>
  <li class="warn"><b>Ещё 30 дней</b>только вы можете продлить адрес</li>
  <li class="warn"><b>После этого</b>регистрацию аннулируют, адрес может занять кто угодно</li>
</ol>
