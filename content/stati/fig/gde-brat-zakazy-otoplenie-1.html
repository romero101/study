<p class="fig-title">Когда хозяин дома доходит до отопления</p>
<ol class="flow">
  <li><b>Коробка и кровля</b><span>строители дома</span></li>
  <li><b>Скважина и ввод воды</b><span>бурильщики</span></li>
  <li><b>Газ или выделенная мощность</b><span>газовая служба, электрики</span></li>
  <li class="win"><b>Отопление и котельная</b><span>вы — если вас порекомендовали на шагах 1–3</span></li>
  <li><b>Стяжка и отделка</b><span>отделочники ждут, пока вы закончите</span></li>
</ol>
