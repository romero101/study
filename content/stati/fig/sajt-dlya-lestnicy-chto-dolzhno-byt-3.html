<p class="fig-title">Когда звать мастерскую лестниц</p>
<ol class="tl">
  <li><b>Проём готов</b>замер, эскиз, вилка, договор</li>
  <li><b>До чистовой отделки</b>монтаж каркаса — по нему уже можно ходить</li>
  <li class="warn"><b>Идёт отделка</b>ступени и ограждение делаются в цехе, на объект не везут</li>
  <li><b>После маляров</b>монтаж ступеней и ограждения, покрытие</li>
</ol>
