<p class="fig-title">Что происходит с доменом, если пропустить оплату</p>
<ol class="tl">
  <li><b>За 50–60 дней</b>регистратор шлёт напоминание на почту администратора домена</li>
  <li class="warn"><b>Срок закончился</b>сайт перестаёт открываться</li>
  <li><b>Ещё 30 дней</b>домен можно продлить — через Госуслуги</li>
  <li class="warn"><b>Потом</b>регистрацию аннулируют, адрес может занять кто угодно</li>
</ol>
