<p class="fig-title">Норма первого касания</p>
<ol class="tl">
  <li><b>Несколько минут</b>рабочее время, кто-то свободен: звонит тот, кто первым написал «беру»</li>
  <li class="warn"><b>До получаса</b>все на объектах: короткий звонок или сообщение с точным временем разговора</li>
  <li><b>Утро, до выезда</b>заявка пришла вечером или в выходной: автоответ сразу, звонок первым делом</li>
</ol>
