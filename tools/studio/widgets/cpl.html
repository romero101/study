<div class="widget" id="cpl">
  <div class="w-in">
    <div class="w-row">
      <label>Расход на рекламу <i>· ₽ в месяц</i><input type="number" id="cpl-budget" inputmode="numeric" min="0" step="1000" value="60000"></label>
      <label>Кликов <i>· в месяц</i><input type="number" id="cpl-clicks" inputmode="numeric" min="0" step="10" value="800"></label>
    </div>
    <div class="w-row">
      <label>Заявок и звонков <i>· в месяц</i><input type="number" id="cpl-leads" inputmode="numeric" min="0" value="12"></label>
      <label>Доходит до договора <i>· %</i><input type="number" id="cpl-deal" inputmode="numeric" min="0" max="100" value="25"></label>
    </div>
    <label>Если сайт станет превращать в заявку <span id="cpl-target-out">4,0%</span> кликов
      <input type="range" id="cpl-target" min="1" max="10" step="0.5" value="4"></label>
    <p class="w-hint">Клики и расход — из кабинета Директа, отчёт «Статистика» за месяц. Ничего никуда не отправляется, считает ваш браузер.</p>
  </div>
  <div class="w-out">
    <dl>
      <dt>Конверсия сайта сейчас</dt><dd id="cpl-cr">—</dd>
      <dt>Заявка стоит сейчас</dt><dd id="cpl-now">—</dd>
      <dt>Один клиент обходится в</dt><dd id="cpl-client">—</dd>
      <dt>Заявок при новой конверсии</dt><dd id="cpl-new-leads">—</dd>
    </dl>
    <span class="w-cap">Заявка будет стоить</span>
    <div class="w-big" id="cpl-new">—</div>
    <p class="w-say" id="cpl-verdict"></p>
    <a class="button" href="#request" id="cpl-go">Разобрать мои цифры ↗</a>
  </div>
</div>
