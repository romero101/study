<div class="widget" id="ex">
  <div class="w-in">
    <label>Тип забора<select id="ex-type">
      <option value="2900">Профнастил, высота 2 м</option>
      <option value="1900">Сетка 3D</option>
      <option value="4300">Евроштакетник</option>
      <option value="5600">Жалюзи</option></select></label>
    <label>Длина — <span id="ex-len-out">60 м</span><input type="range" id="ex-len" min="10" max="200" step="5" value="60"></label>
    <label class="check"><input type="checkbox" id="ex-gate" checked> Откатные ворота</label>
    <label class="check"><input type="checkbox" id="ex-wicket" checked> Калитка</label>
    <p class="w-hint">Это пример: цены условные. На вашем сайте калькулятор считает по вашему прайсу.</p>
  </div>
  <div class="w-out">
    <span class="w-cap">Забор с установкой</span>
    <div class="w-big" id="ex-sum">—</div>
    <p id="ex-per" style="margin:0;color:#c3cfdf;font-size:15.5px"></p>
    <p class="w-say">Посетитель увидел цену, не оставив телефон. Дальше у него одна кнопка — отправить этот расчёт вам в MAX или заявкой. Вы перезваниваете человеку, который уже знает сумму.</p>
    <a class="button" href="#request" id="ex-go">Хочу такой калькулятор ↗</a>
  </div>
</div>
